<!doctype html>
<html>
  <head>
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <header class="topbar">
      <h1>💰 Expense Tracker</h1>
      <button id="toggle-form-btn" class="btn-primary">+ Add Expense</button>
    </header>

    <main class="dashboard">
      <section class="summary-cards">
        <div class="card">
          <p class="card-label">Total Income</p>
          <p class="card-value income" id="total-income">$0.00</p>
        </div>
        <div class="card">
          <p class="card-label">Total Expenses</p>
          <p class="card-value expense" id="total-expenses">$0.00</p>
        </div>
        <div class="card">
          <p class="card-label">Balance</p>
          <p class="card-value" id="balance">$0.00</p>
        </div>
      </section>

      <form id="expense-form">
        <input type="date" id="date" required />
        <input
          type="text"
          id="description"
          placeholder="Description"
          required
        />
        <input
          type="number"
          step="0.01"
          id="amount"
          placeholder="Amount"
          required
          min="0"
        />
        <select id="category">
          <option value="Subscriptions">Subscriptions</option>
          <option value="Food & Groceries">Food & Groceries</option>
          <option value="Transport">Transport</option>
          <option value="Health & Fitness">Health & Fitness</option>
          <option value="Income">Income</option>
          <option value="Bills & Utilities">Bills & Utilities</option>
          <option value="Other">Other</option>
        </select>
        <label
          ><input type="radio" name="type" value="debit" checked /> Debit
          (expense)</label
        >
        <label
          ><input type="radio" name="type" value="credit" /> Credit
          (income)</label
        >
        <button type="submit" class="btn-primary">Add</button>
      </form>

      <section class="grid-2">
        <div class="panel">
          <h2>Spending by Category</h2>
          <canvas id="categoryChart"></canvas>
        </div>
        <div class="panel">
          <h2>Quick Stats</h2>
          <p id="quick-stats" class="muted">Loading...</p>
        </div>
      </section>

      <section class="panel">
        <h2>Transactions</h2>
        <table id="transactions-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Description</th>
              <th>Amount</th>
              <th>Category</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
    </main>

    <script>
      const categories = [
        "Subscriptions",
        "Food & Groceries",
        "Transport",
        "Health & Fitness",
        "Income",
        "Bills & Utilities",
        "Other",
      ];

      document
        .getElementById("toggle-form-btn")
        .addEventListener("click", () => {
          document
            .getElementById("expense-form-section")
            .classList.toggle("hidden");
        });

      function loadTransactions() {
        fetch("/transactions")
          .then((response) => response.json())
          .then((data) => {
            const tbody = document.querySelector("#transactions-table tbody");
            tbody.innerHTML = "";
            data.forEach((t) => {
              const row = document.createElement("tr");
              const options = categories
                .map(
                  (c) =>
                    `<option value="${c}" ${c === t.category ? "selected" : ""}>${c}</option>`,
                )
                .join("");
              row.innerHTML = `
                            <td>${t.date}</td>
                            <td>${t.description}</td>
                            <td class="${t.amount < 0 ? "expense" : "income"}">${t.amount}</td>
                            <td><select onchange="updateCategory(${t.id}, this.value)">${options}</select></td>
                        `;
              tbody.appendChild(row);
            });
            document.getElementById("quick-stats").textContent =
              `${data.length} transactions recorded`;
          });
      }

      function updateCategory(id, newCategory) {
        fetch(`/transactions/${id}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ category: newCategory }),
        }).then(() => {
          loadChart();
          loadSummary();
        });
      }

      document
        .getElementById("expense-form")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const rawAmount = Math.abs(
            parseFloat(document.getElementById("amount").value),
          );
          const type = document.querySelector(
            'input[name="type"]:checked',
          ).value;
          const signedAmount = type === "debit" ? -rawAmount : rawAmount;

          const newExpense = {
            date: document.getElementById("date").value,
            description: document.getElementById("description").value,
            amount: signedAmount,
            category: document.getElementById("category").value,
          };

          fetch("/transactions", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(newExpense),
          })
            .then((response) => response.json())
            .then(() => {
              document.getElementById("expense-form").reset();
              document
                .getElementById("expense-form-section")
                .classList.add("hidden");
              loadTransactions();
              loadChart();
              loadSummary();
            });
        });
      let chartInstance = null;
      function loadChart() {
        fetch("/summary/category")
          .then((response) => response.json())
          .then((data) => {
            const ctx = document
              .getElementById("categoryChart")
              .getContext("2d");
            if (chartInstance) chartInstance.destroy();
            chartInstance = new Chart(ctx, {
              type: "bar",
              data: {
                labels: Object.keys(data),
                datasets: [
                  {
                    label: "Amount Spent",
                    data: Object.values(data),
                    backgroundColor: [
                      "#2563eb",
                      "#f59e0b",
                      "#10b981",
                      "#ef4444",
                      "#8b5cf6",
                      "#ec4899",
                      "#6b7280",
                    ],
                  },
                ],
              },
              options: { scales: { y: { beginAtZero: true } } },
            });
          });
      }

      function loadSummary() {
        fetch("/summary/overview")
          .then((response) => response.json())
          .then((data) => {
            document.getElementById("total-income").textContent =
              `$${data.total_income.toFixed(2)}`;
            document.getElementById("total-expenses").textContent =
              `$${data.total_expenses.toFixed(2)}`;
            document.getElementById("balance").textContent =
              `$${data.balance.toFixed(2)}`;
          });
      }

      loadTransactions();
      loadChart();
      loadSummary();
    </script>
  </body>
</html>
