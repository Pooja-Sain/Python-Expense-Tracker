<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KharchaTrack — Transactions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/style.css" />
    <script type="module" src="/static/js/transactions.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-icon">💰</span>
        <div>
          <h1>KharchaTrack</h1>
          <p class="tagline">Your money, tracked simply</p>
        </div>
      </div>
      <nav class="navbar">
        <a href="/dashboard" class="nav-link">Dashboard</a>
        <a href="/static/transactions.html" class="nav-link active">Transactions</a>
        <a href="/static/subscriptions.html" class="nav-link">Subscriptions</a>
        <a href="/static/reports.html" class="nav-link">Reports</a>
      </nav>
      <div class="topbar-actions">
        <label for="csv-file-input" class="btn-ghost btn-file">⬆ Import CSV</label>
        <input type="file" id="csv-file-input" accept=".csv" hidden />
        <button id="toggle-form-btn" class="btn-primary" type="button">+ Add Expense</button>
        <div class="nav-user">
          <span id="user-email" class="user-email"></span>
          <button id="logout-btn" class="btn-ghost" type="button">Log out</button>
        </div>
      </div>
    </header>

    <main class="dashboard">
      <section class="panel">
        <div class="panel-header">
          <h2>All Transactions</h2>
          <p class="muted" id="tx-count">Loading…</p>
        </div>
        <p id="import-status" class="import-status hidden"></p>
        <div class="table-wrap">
          <table id="transactions-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Description</th>
                <th>Amount</th>
                <th>Category</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>

    <div id="expense-form-section" class="modal-overlay hidden">
      <div class="modal">
        <div class="modal-header">
          <h2>Add Expense</h2>
          <button id="close-form-btn" class="btn-icon" type="button" aria-label="Close">✕</button>
        </div>
        <form id="expense-form">
          <label>
            Date
            <input type="date" id="date" required />
          </label>
          <label>
            Description
            <input type="text" id="description" placeholder="e.g. Netflix, Groceries" required />
          </label>
          <label>
            Amount (₹)
            <input type="number" step="0.01" id="amount" placeholder="0.00" required min="0" />
          </label>
          <label>
            Category
            <select id="category">
              <option value="Subscriptions">Subscriptions</option>
              <option value="Food & Groceries">Food & Groceries</option>
              <option value="Transport">Transport</option>
              <option value="Health & Fitness">Health & Fitness</option>
              <option value="Income">Income</option>
              <option value="Bills & Utilities">Bills & Utilities</option>
              <option value="Other">Other</option>
            </select>
          </label>
          <div class="radio-row">
            <label class="radio-label"><input type="radio" name="type" value="debit" checked /> Expense</label>
            <label class="radio-label"><input type="radio" name="type" value="credit" /> Income</label>
          </div>
          <button type="submit" class="btn-primary btn-block">Add</button>
        </form>
      </div>
    </div>
  </body>
</html>
