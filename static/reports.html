<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KharchaTrack — Reports</title>
    <link rel="stylesheet" href="/static/css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="/static/js/reports.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-icon">💰</span>
        <div>
          <h1>KharchaTrack</h1>
          <p class="tagline">Your money, tracked simply</p>
        </div>
      </div>
      <nav class="navbar">
        <a href="/" class="nav-link">Dashboard</a>
        <a href="/static/transactions.html" class="nav-link">Transactions</a>
        <a href="/static/subscriptions.html" class="nav-link">Subscriptions</a>
        <a href="/static/reports.html" class="nav-link active">Reports</a>
      </nav>
      <button id="toggle-form-btn" class="btn-primary" type="button">+ Add Expense</button>
    </header>

    <main class="dashboard">
      <section class="panel">
        <h2>Monthly Trend</h2>
        <div class="chart-wrap tall">
          <canvas id="trendChart"></canvas>
        </div>
      </section>

      <section class="panel">
        <h2>Spending by Category</h2>
        <div class="table-wrap">
          <table id="category-table">
            <thead>
              <tr>
                <th>Category</th>
                <th>Amount</th>
                <th>Share of spend</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>

    <div id="expense-form-section" class="modal-overlay hidden">
      <div class="modal">
        <div class="modal-header">
          <h2>Add Expense</h2>
          <button id="close-form-btn" class="btn-icon" type="button" aria-label="Close">✕</button>
        </div>
        <form id="expense-form">
          <label>
            Date
            <input type="date" id="date" required />
          </label>
          <label>
            Description
            <input type="text" id="description" placeholder="e.g. Netflix, Groceries" required />
          </label>
          <label>
            Amount (₹)
            <input type="number" step="0.01" id="amount" placeholder="0.00" required min="0" />
          </label>
          <label>
            Category
            <select id="category">
              <option value="Subscriptions">Subscriptions</option>
              <option value="Food & Groceries">Food & Groceries</option>
              <option value="Transport">Transport</option>
              <option value="Health & Fitness">Health & Fitness</option>
              <option value="Income">Income</option>
              <option value="Bills & Utilities">Bills & Utilities</option>
              <option value="Other">Other</option>
            </select>
          </label>
          <div class="radio-row">
            <label class="radio-label"><input type="radio" name="type" value="debit" checked /> Expense</label>
            <label class="radio-label"><input type="radio" name="type" value="credit" /> Income</label>
          </div>
          <button type="submit" class="btn-primary btn-block">Add</button>
        </form>
      </div>
    </div>
  </body>
</html>
