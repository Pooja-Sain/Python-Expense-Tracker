<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KharchaTrack — Subscriptions</title>
    <link rel="stylesheet" href="/static/css/style.css" />
    <script type="module" src="/static/js/subscriptions.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-icon">💰</span>
        <div>
          <h1>KharchaTrack</h1>
          <p class="tagline">Your money, tracked simply</p>
        </div>
      </div>
      <nav class="navbar">
        <a href="/" class="nav-link">Dashboard</a>
        <a href="/static/transactions.html" class="nav-link">Transactions</a>
        <a href="/static/subscriptions.html" class="nav-link active">Subscriptions</a>
        <a href="/static/reports.html" class="nav-link">Reports</a>
      </nav>
      <button id="toggle-form-btn" class="btn-primary" type="button">+ Add Expense</button>
    </header>

    <main class="dashboard">
      <section class="sub-summary">
        <div class="card">
          <div class="card-icon" style="background: rgba(139, 92, 246, 0.12); color: #8b5cf6">🎬</div>
          <div>
            <p class="card-label">Estimated Monthly Cost</p>
            <p class="card-value" id="subs-monthly-total">₹0</p>
          </div>
        </div>
        <div class="card">
          <div class="card-icon balance-bg">#</div>
          <div>
            <p class="card-label">Active Subscriptions</p>
            <p class="card-value" id="subs-count">0</p>
          </div>
        </div>
      </section>

      <section class="panel">
        <h2>Detected Subscriptions</h2>
        <p class="muted" style="margin-top: -8px; font-size: 13px;">
          Grouped from expenses tagged "Subscriptions" — automatic recurring-payment detection is on the roadmap.
        </p>
        <div id="subs-list" style="margin-top: 16px;"></div>
      </section>
    </main>

    <div id="expense-form-section" class="modal-overlay hidden">
      <div class="modal">
        <div class="modal-header">
          <h2>Add Expense</h2>
          <button id="close-form-btn" class="btn-icon" type="button" aria-label="Close">✕</button>
        </div>
        <form id="expense-form">
          <label>
            Date
            <input type="date" id="date" required />
          </label>
          <label>
            Description
            <input type="text" id="description" placeholder="e.g. Netflix, Groceries" required />
          </label>
          <label>
            Amount (₹)
            <input type="number" step="0.01" id="amount" placeholder="0.00" required min="0" />
          </label>
          <label>
            Category
            <select id="category">
              <option value="Subscriptions">Subscriptions</option>
              <option value="Food & Groceries">Food & Groceries</option>
              <option value="Transport">Transport</option>
              <option value="Health & Fitness">Health & Fitness</option>
              <option value="Income">Income</option>
              <option value="Bills & Utilities">Bills & Utilities</option>
              <option value="Other">Other</option>
            </select>
          </label>
          <div class="radio-row">
            <label class="radio-label"><input type="radio" name="type" value="debit" checked /> Expense</label>
            <label class="radio-label"><input type="radio" name="type" value="credit" /> Income</label>
          </div>
          <button type="submit" class="btn-primary btn-block">Add</button>
        </form>
      </div>
    </div>
  </body>
</html>
